<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Change password — Project RUNWAY</title>
<link rel="stylesheet" href="/app.css" />
<link rel="icon" href="data:," />
</head>
<body>
<main class="auth">
  <form class="auth__card glass" id="form" novalidate>
    <h1 class="auth__title">Change password</h1>
    <p class="auth__sub">Choose a new password (minimum 10 characters)</p>

    <div class="alert alert--error" id="alert" hidden></div>

    <div class="field">
      <label for="current">Current password</label>
      <input class="input" type="password" id="current" required autocomplete="current-password" />
    </div>

    <div class="field">
      <label for="next">New password</label>
      <input class="input" type="password" id="next" required minlength="10" autocomplete="new-password" />
    </div>

    <div class="field">
      <label for="confirm">Confirm new password</label>
      <input class="input" type="password" id="confirm" required minlength="10" autocomplete="new-password" />
    </div>

    <button class="btn btn--primary" type="submit" id="submit" style="width:100%;margin-top:0.5rem">
      Update password
    </button>
  </form>
</main>

<script>
  const form = document.getElementById('form');
  const alertBox = document.getElementById('alert');
  const submit = document.getElementById('submit');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    alertBox.hidden = true;

    const next = document.getElementById('next').value;
    if (next !== document.getElementById('confirm').value) {
      alertBox.textContent = 'Passwords do not match.';
      alertBox.hidden = false;
      return;
    }

    submit.disabled = true;
    submit.textContent = 'Updating…';
    try {
      const res = await fetch('/api/me/password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          currentPassword: document.getElementById('current').value,
          newPassword: next,
        }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body?.error?.message || 'Update failed');
      window.location.href = '/';
    } catch (err) {
      alertBox.textContent = err.message;
      alertBox.hidden = false;
      submit.disabled = false;
      submit.textContent = 'Update password';
    }
  });
</script>
</body>
</html>
